
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gaindollar - Register</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      margin: 0;
      padding: 25px 15px;
      color: #172033;
    }
    .card {
      max-width: 420px;
      margin: 25px auto;
      padding: 25px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 4px 18px #0001;
    }
    h1 { color: #087b45; text-align: center; }
    p { text-align: center; }
    label { display: block; margin-top: 15px; }
    input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #ccd3dc;
      border-radius: 7px;
    }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: 0;
      border-radius: 7px;
      background: #087b45;
      color: white;
      font-size: 16px;
    }
    .note { color: #596579; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Gaindollar</h1>
    <p>Create your account</p>

    <form id="registerForm">
      <label>Full name</label>
      <input name="name" required placeholder="Enter your full name">

      <label>Email address</label>
      <input name="email" type="email" required placeholder="Enter your email">

      <label>Create password</label>
      <input name="password" type="password" minlength="8"
        required placeholder="At least 8 characters">

      <label>Referral code (optional)</label>
      <input id="referral" name="referral"
        placeholder="Enter referral code">

      <button type="submit">Create account</button>
    </form>

    <p class="note" id="message">
      Join Gaindollar today.
    </p>
    <p class="note">
      Demo page only. Accounts are not yet saved.
    </p>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    document.getElementById("referral").value =
      params.get("ref") || "";

    document.getElementById("registerForm")
      .addEventListener("submit", function(event) {
        event.preventDefault();
        document.getElementById("message").textContent =
          "Demo only: registration is not active yet. No account was saved.";
      });
  </script>
</body>
</html>
